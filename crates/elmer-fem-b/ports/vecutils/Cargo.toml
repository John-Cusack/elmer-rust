[package]
name = "vecutils"
version = "0.1.0"
edition = "2021"

[lib]
name = "vecutils"
crate-type = ["staticlib"]

# Standalone package: the fem-b lane crate has no nested workspace
# manifest (unlike fem-a), so this port keeps itself out of the root
# workspace and builds on its own — the same shape the harmutils port
# has in the lane checkout.
[workspace]
