[package]
name = "elmer-physics-meshtools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Mesh utility solvers (RigidMeshMapper, StructuredMeshMapper, StructuredProjectToPlane, MeshChecksum) for the Rust-native Elmer rewrite"

[dependencies]
elmer-core.workspace = true
elmer-solver = { path = "../elmer-solver" }
thiserror.workspace = true

[dev-dependencies]
# The pristine quick tests run HeatSolve behind the mappers.
elmer-physics-heat = { path = "../elmer-physics-heat" }
elmer-fe = { path = "../elmer-fe" }
elmer-krylov = { path = "../elmer-krylov" }
elmer-sparse = { path = "../elmer-sparse" }
elmer-sif = { path = "../elmer-sif" }
