[package]
name = "elmer-pdofs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "p-element degree-of-freedom layer: mesh edges, edge/face/bubble DOF numbering, Perm and an assembly adapter with Elmer semantics"

[dependencies]
elmer-core.workspace = true
thiserror.workspace = true
elmer-assembly = { path = "../elmer-assembly" }
elmer-fe = { path = "../elmer-fe" }
elmer-fe-hp = { path = "../elmer-fe-hp" }
elmer-solver = { path = "../elmer-solver" }

[dev-dependencies]
# Sparse LU for the end-to-end PoissonPFEM solve.
elmer-direct = { path = "../elmer-direct" }
# The end-to-end case runs read case.sif.
elmer-sif = { path = "../elmer-sif" }
