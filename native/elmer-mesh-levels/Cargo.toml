[package]
name = "elmer-mesh-levels"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Mesh multiplication (Simulation 'Mesh Levels', SplitMeshEqual) and in-solver extrusion (MeshExtrude) for the Rust-native Elmer rewrite, with Elmer's node and element numbering"

[dependencies]
elmer-core.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Parses the quick tests' Simulation and BC sections into ParamMaps.
elmer-sif = { path = "../elmer-sif" }
# Linear table lookup for a tabulated Extruded Mesh Density.
elmer-expr = { path = "../elmer-expr" }
