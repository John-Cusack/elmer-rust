[package]
name = "elmer-physics-advdiff"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "AdvectionDiffusion and ModelPDE AdvDiffSolver element kernels and solvers for the Rust-native Elmer rewrite"

[dependencies]
elmer-core.workspace = true
thiserror.workspace = true
elmer-solver = { path = "../elmer-solver" }
elmer-fe = { path = "../elmer-fe" }

[dev-dependencies]
# HUTI BiCGStab and ILU(n) for the quick tests' iterative solves; the heat
# solver for the Soret cases that couple temperature into the species field.
elmer-krylov = { path = "../elmer-krylov" }
elmer-sparse = { path = "../elmer-sparse" }
elmer-physics-heat = { path = "../elmer-physics-heat" }
