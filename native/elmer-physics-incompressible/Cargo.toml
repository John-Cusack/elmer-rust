[package]
name = "elmer-physics-incompressible"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "IncompressibleNSSolver (pressure-stabilized equal-order incompressible Navier-Stokes) kernels and solver for the Rust-native Elmer rewrite"

[dependencies]
elmer-core.workspace = true
elmer-fe = { path = "../elmer-fe" }
elmer-physics-flow = { path = "../elmer-physics-flow" }
elmer-solver = { path = "../elmer-solver" }
thiserror.workspace = true

[dev-dependencies]
# The p dofs of the Taylor-Hood cases.
elmer-pdofs = { path = "../elmer-pdofs" }
# ModelPDE solving the temperature of the transient compressible case.
elmer-physics-advdiff = { path = "../elmer-physics-advdiff" }
