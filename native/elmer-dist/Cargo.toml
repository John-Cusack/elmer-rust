[package]
name = "elmer-dist"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Distributed (owned/ghost) CSR, interface-exchanged SpMV and parallel HUTI Krylov solves for the Rust-native Elmer rewrite"

[dependencies]
elmer-core.workspace = true
elmer-krylov = { path = "../elmer-krylov" }
elmer-mpi = { path = "../elmer-mpi" }
elmer-sparse = { path = "../elmer-sparse" }
thiserror.workspace = true
# Same C MPI bindings (no Fortran) and version elmer-mpi already pins.
mpi = { version = "0.8", default-features = false }

# Relaunches itself under mpirun (np 1 and 2); see the file's docs.
[[test]]
name = "mpi"
harness = false
